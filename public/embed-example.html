<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Interior Designer — Пример встраивания</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
        background: #f5f5f5;
      }
      h1 {
        text-align: center;
      }
      .embed-container {
        border: 2px dashed #ccc;
        border-radius: 8px;
        overflow: hidden;
        margin-top: 1rem;
      }
      iframe {
        display: block;
        width: 100%;
        height: 800px;
        border: none;
      }
    </style>
  </head>
  <body>
    <h1>Пример встраивания 3D Interior Designer</h1>
    <p>
      Ниже показан виджет, встроенный через <code>&lt;iframe&gt;</code>. На реальном сайте замените
      <code>src</code> на URL вашего развёрнутого приложения.
    </p>
    <div class="embed-container">
      <iframe src="/" title="3D Interior Designer" allowfullscreen></iframe>
    </div>
  </body>
</html>
